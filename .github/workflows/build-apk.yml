name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fdroid-debug:
    name: Build F-Droid debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew --no-daemon assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: notification-fdroid-debug-${{ github.run_number }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  build-fdroid-release:
    name: Build signed F-Droid release APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required signing secret ${secret_name} is not configured"
              exit 1
            fi
          done

          signing_dir="${RUNNER_TEMP}/android-signing"
          mkdir -p "${signing_dir}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${signing_dir}/notification-release.jks"
          echo "ANDROID_KEYSTORE_PATH=${signing_dir}/notification-release.jks" \
            >> "${GITHUB_ENV}"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleFdroidRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          release_apk="$(find app/build/outputs/apk/fdroid/release \
            -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "${release_apk}"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" \
            -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "${apksigner_path}"
          "${apksigner_path}" verify --verbose --print-certs "${release_apk}"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: notification-fdroid-release-${{ github.run_number }}
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Remove production signing key
        if: always()
        shell: bash
        run: rm -f "${ANDROID_KEYSTORE_PATH:-}"

  release_please:
    name: Prepare or create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-fdroid-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0

  publish-github-release:
    name: Attach APK to GitHub Release
    if: needs.release_please.outputs.release_created == 'true'
    needs:
      - build-fdroid-release
      - release_please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: notification-fdroid-release-${{ github.run_number }}
          path: release-apk

      - name: Upload raw APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release Please returned an invalid tag: ${RELEASE_TAG}"
            exit 1
          fi

          release_apk="$(find release-apk -type f -name '*.apk' -print -quit)"
          if [[ -z "${release_apk}" ]]; then
            echo "::error::Signed release APK was not found in the downloaded artifact"
            exit 1
          fi

          asset_name="notification-${RELEASE_TAG}-fdroid-release.apk"
          cp "${release_apk}" "${asset_name}"
          gh release upload "${RELEASE_TAG}" "${asset_name}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
